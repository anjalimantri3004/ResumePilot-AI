<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ResumePilot AI</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI, Arial, sans-serif;
}

body{
    width:340px;
    padding:18px;
    background:#ffffff;
    color:#111827;
}

.header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:8px;
}

.header img{
    width:26px;
    height:26px;
}

h1{
    font-size:22px;
    font-weight:700;
}

.subtitle{
    text-align:center;
    color:#6b7280;
    font-size:13px;
    margin-bottom:18px;
    line-height:1.5;
}

.card{
    border:1px solid #e5e7eb;
    border-radius:14px;
    padding:18px;
    margin-bottom:16px;
}

button{
    width:100%;
    border:none;
    border-radius:12px;
    padding:13px;
    font-size:15px;
    font-weight:600;
    cursor:pointer;
    transition:.2s;
}

#captureBtn{
    background:#2563eb;
    color:white;
}

#captureBtn:hover{
    background:#1d4ed8;
}

#openAppBtn{
    background:#f3f4f6;
    color:#111827;
    margin-top:10px;
}

#openAppBtn:hover{
    background:#e5e7eb;
}

.status-title{
    font-weight:600;
    margin-bottom:8px;
}

#status{
    font-size:13px;
    color:#6b7280;
    line-height:1.5;
}

.footer{
    text-align:center;
    color:#9ca3af;
    font-size:11px;
    margin-top:8px;
}
</style>

</head>
<body>

<div class="header">
    <img src="icon48.png" alt="ResumePilot">
    <h1>ResumePilot AI</h1>
</div>

<p class="subtitle">
    Capture the Job Description from the current page.
</p>

<div class="card">

    <button id="captureBtn">
        Capture Job Description
    </button>

    <button id="openAppBtn">
        Open ResumePilot
    </button>

</div>

<div class="card">

    <div class="status-title">Status</div>

    <div id="status">
        Ready to capture.
    </div>

</div>

<div class="footer">
LinkedIn • Naukri • Quest Global • Indeed • Foundit
</div>

<script src="popup.js"></script>

</body>
</html>
